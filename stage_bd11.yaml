description: |
  Consumer-Partition 分配 (round-robin)、副本因子设计、
  消费滞后判定、吞吐量估算; 含实时埋点的业务案例。

learning_objectives:
  - 能给定 consumer 列表与 partition 列表, 用 round-robin 分配 (consumer→[partitions])
  - 能给定容错数与 broker 数, 计算最小副本因子
  - 能给定 consumer offset 与 log_end_offset, 判断消费滞后是否严重
