[DEFAULT]
# 实训资源导入配置文件

[paths]
# 资源目录路径（相对于backend目录）
resource_base = ziyuan/实训资源

# 对象存储基础路径
storage_base = ziyuan

[database]
# 数据库连接配置（使用环境变量或默认值）
# 这些值会从 .env 文件自动加载

[import]
# 默认管理员用户名
default_admin = admin

# 批量导入时的批次大小
batch_size = 10

# 是否跳过已存在的实训
skip_existing = true

# 导入后的默认状态
default_publish_status = EDITING
default_visibility = PRIVATE

[file_types]
# 支持的数据集文件类型
dataset_extensions = .csv,.xlsx,.xls,.json,.sql,.txt

# 支持的素材文件类型
asset_extensions = .png,.jpg,.jpeg,.gif,.mp4,.webm,.svg

# SQL文件类型映射
sql_schema_files = create.sql,schema.sql,ddl.sql
sql_data_files = insert.sql,data.sql,dml.sql

[logging]
# 日志级别：DEBUG, INFO, WARNING, ERROR
level = INFO

# 日志文件路径
log_file = seed_training_resources.log