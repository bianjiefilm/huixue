description: |
  图像分割概念 (像素级标签)、二值阈值分割、连通区域计数、
  Dice 系数 / 像素准确率评估指标; 含医学影像分割业务案例。

learning_objectives:
  - 能给定灰度值列表与阈值, 做二值阈值分割 (>= 1, < 0)
