course: 数据挖掘
stage: 2
title: 数据探索与特征理解
order_in_practice: 2
difficulty: beginner

description: |
  探索性数据分析 (EDA) 的位置与作用、摘要统计 (count/mean/median/std/range)、
  Pearson 相关性分析与解读陷阱、四分位数与 IQR 异常值规则、电商用户行为业务案例。

learning_objectives:
  - 能从一对数值列表计算 Pearson 相关系数, 理解 [-1, 1] 区间含义
  - 能用 IQR 规则识别异常值索引
  - 能从一组数值列表计算摘要统计 (mean/median/std/range)
  - 能从一组数值列表计算五数概括 (min/Q1/median/Q3/max)

