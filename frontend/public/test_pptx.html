<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/@vue-office/pptx"></script>
  <style>
    body { margin: 0; padding: 0; }
    #app { width: 100vw; height: 100vh; }
    .vue-office-pptx { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app">
    <vue-office-pptx :src="src" @rendered="rendered" @error="error" />
  </div>
  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const src = ref('http://localhost:8000/static/resources/%E8%AF%BE%E7%A8%8B%E8%B5%84%E6%BA%90/%E7%A5%9E%E7%BB%8F%E7%BD%91%E7%BB%9C%E4%B8%8E%E6%B7%B1%E5%BA%A6%E5%AD%A6%E4%B9%A0/%E8%A7%86%E9%A2%91%E5%92%8C%E8%AF%BE%E4%BB%B6/%E7%A5%9E%E7%BB%8F%E7%BD%91%E7%BB%9C%E8%AF%BE%E7%A8%8B_%E8%A7%86%E9%A2%919_%E8%BF%81%E7%A7%BB%E5%AD%A6%E4%B9%A0.pptx');
        const rendered = () => console.log('RENDERED SUCCESSFULLY');
        const error = (e) => console.log('RENDER ERROR', e);
        return { src, rendered, error };
      }
    }).component('vue-office-pptx', vueOfficePptx).mount('#app');
  </script>
</body>
</html>
