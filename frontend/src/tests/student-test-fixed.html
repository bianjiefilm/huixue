<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生管理模块 Mock API 测试</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ant-design-vue@3.2.20/dist/antd.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-container {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      background-color: #fff;
      min-height: 120px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .action-bar {
      margin-bottom: 20px;
    }
    .success {
      color: #52c41a;
    }
    .error {
      color: #ff4d4f;
    }
    .message {
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: none;
    }
    .message-success {
      background-color: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #52c41a;
    }
    .message-error {
      background-color: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
    }
    .message-info {
      background-color: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #1890ff;
    }
  </style>
  
  <!-- 处理Chrome扩展错误 -->
  <script>
    window.addEventListener('error', function(event) {
      if (event && event.message && event.message.includes('Receiving end does not exist')) {
        event.stopImmediatePropagation();
        event.preventDefault();
        return true;
      }
    }, true);
  </script>
</head>
<body>
  <div id="app" class="container">
    <div class="header">
      <h1>学生管理模块 Mock API 测试</h1>
    </div>

    <div class="action-bar">
      <a-space>
        <a-button type="primary" @click="testGetStudentList">获取学生列表</a-button>
        <a-button @click="testGetStudentDetail">获取学生详情</a-button>
        <a-button @click="testCreateStudent">创建学生</a-button>
        <a-button @click="testUpdateStudent">更新学生</a-button>
        <a-button danger @click="testDeleteStudent">删除学生</a-button>
        <a-button @click="testBatchOperations">批量操作</a-button>
        <a-button @click="testOrganizationTree">获取组织架构</a-button>
      </a-space>
    </div>

    <div class="result-container">
      <pre id="result">测试结果将显示在这里...</pre>
    </div>

    <div class="message" id="message"></div>
  </div>

  <!-- 加载依赖库 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.3.4/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mockjs@1.1.0/dist/mock.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ant-design-vue@3.2.20/dist/antd.min.js"></script>

  <script>
    // 自定义消息通知函数
    function showMessage(type, content, duration = 3000) {
      const messageEl = document.getElementById('message');
      messageEl.className = `message message-${type}`;
      messageEl.textContent = content;
      messageEl.style.display = 'block';
      
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, duration);
    }

    // 模拟学生数据处理模块
    (function() {
      // 学生基本信息
      const studentMock = {
        // 模拟一些学生数据
        generateStudents(count, orgId) {
          const departments = {
            'college-1': '计算机学院',
            'college-2': '信息学院',
            'major-1': '计算机科学与技术',
            'major-2': '软件工程',
            'class-1': '计科2101班',
            'class-2': '计科2102班',
            'class-3': '计科2201班',
            'class-4': '软工2101班'
          };
          
          // 根据组织ID确定年级和班级
          let grade = '';
          let className = '';
          
          if (orgId.startsWith('class')) {
            const classInfo = departments[orgId] || '';
            const match = classInfo.match(/(\d{2})(\d{2})/);
            if (match) {
              grade = `20${match[1]}`;
              className = classInfo;
            }
          }
          
          const result = [];
          
          for (let i = 1; i <= count; i++) {
            const id = `student-${orgId}-${i}`;
            const yearPrefix = grade ? grade.substring(2) : '21';
            
            result.push({
              id,
              name: `学生${i}`,
              studentId: `${yearPrefix}${String(Math.floor(Math.random() * 10000)).padStart(4, '0')}`,
              gender: i % 3 === 0 ? 'female' : 'male',
              avatar: `https://randomuser.me/api/portraits/${i % 3 === 0 ? 'women' : 'men'}/${i % 70}.jpg`,
              department: departments[orgId.split('-')[0] + '-' + orgId.split('-')[1]] || '西北大学',
              grade: grade || '2021',
              className: className || '未分配',
              phone: `1${String(Math.floor(Math.random() * 1000000000) + 3000000000)}`,
              email: `student${i}@example.com`,
              status: i % 10 !== 0, // 10%的几率设为停用状态
              organizationId: orgId
            });
          }
          
          return result;
        },

        // 模拟获取学生列表
        getStudentList(params = {}) {
          const { organizationId = 'school-1', page = 1, pageSize = 10, keyword = '' } = params;
          
          // 根据组织ID生成不同数量的数据
          let items = [];
          
          if (organizationId.startsWith('school')) {
            items = [
              ...this.generateStudents(20, 'class-1'),
              ...this.generateStudents(18, 'class-2'),
              ...this.generateStudents(22, 'class-3'),
              ...this.generateStudents(15, 'class-4')
            ];
          } else if (organizationId.startsWith('college')) {
            if (organizationId === 'college-1') {
              items = [
                ...this.generateStudents(20, 'class-1'),
                ...this.generateStudents(18, 'class-2'),
                ...this.generateStudents(22, 'class-3')
              ];
            } else {
              items = [...this.generateStudents(15, 'class-4')];
            }
          } else if (organizationId.startsWith('major')) {
            if (organizationId === 'major-1') {
              items = [
                ...this.generateStudents(20, 'class-1'),
                ...this.generateStudents(18, 'class-2'),
                ...this.generateStudents(22, 'class-3')
              ];
            } else {
              items = [...this.generateStudents(15, 'class-4')];
            }
          } else if (organizationId.startsWith('grade')) {
            if (organizationId === 'grade-1') {
              items = [
                ...this.generateStudents(20, 'class-1'),
                ...this.generateStudents(18, 'class-2')
              ];
            } else if (organizationId === 'grade-2') {
              items = [...this.generateStudents(22, 'class-3')];
            } else {
              items = [...this.generateStudents(15, 'class-4')];
            }
          } else if (organizationId.startsWith('class')) {
            const count = organizationId === 'class-1' ? 20 :
                          organizationId === 'class-2' ? 18 :
                          organizationId === 'class-3' ? 22 : 15;
            
            items = this.generateStudents(count, organizationId);
          }
          
          // 关键字过滤
          if (keyword) {
            const lowerKeyword = keyword.toLowerCase();
            items = items.filter(item => 
              item.name.toLowerCase().includes(lowerKeyword) || 
              item.studentId.toLowerCase().includes(lowerKeyword)
            );
          }
          
          // 计算分页
          const total = items.length;
          const startIndex = (page - 1) * pageSize;
          const endIndex = Math.min(startIndex + pageSize, total);
          const pagedItems = items.slice(startIndex, endIndex);
          
          return {
            items: pagedItems,
            total
          };
        },

        // 获取学生详情
        getStudentDetail(id) {
          const parts = id.split('-');
          if (parts.length < 3) {
            return null;
          }
          
          const orgId = parts[1];
          const studentIndex = parseInt(parts[2]);
          
          const students = this.generateStudents(studentIndex + 1, orgId);
          return students[studentIndex - 1];
        },

        // 创建学生
        createStudent(data) {
          // 返回一个假的创建结果
          return {
            id: `student-${data.organizationId || 'class-1'}-${Date.now()}`,
            name: data.name || '新学生',
            studentId: data.studentId || '2101' + String(Math.floor(Math.random() * 10000)).padStart(4, '0'),
            gender: data.gender || 'male',
            avatar: data.avatar || 'https://randomuser.me/api/portraits/men/1.jpg',
            department: data.department || '计算机学院',
            grade: data.grade || '2021',
            className: data.className || '计科2101班',
            phone: data.phone || '',
            email: data.email || '',
            status: data.status !== undefined ? data.status : true,
            organizationId: data.organizationId || 'class-1'
          };
        },

        // 更新学生
        updateStudent(id, data) {
          const original = this.getStudentDetail(id);
          if (!original) {
            return null;
          }
          
          // 返回更新后的数据
          return {
            ...original,
            ...data,
            id // 确保ID不变
          };
        },

        // 删除学生
        deleteStudent(id) {
          // 假设删除成功
          return { success: true, message: '删除成功' };
        },

        // 批量删除学生
        batchDeleteStudents(ids) {
          // 假设批量删除成功
          return { success: true, message: `成功删除 ${ids.length} 名学生` };
        },

        // 批量更新学生状态
        batchUpdateStudentStatus(ids, status) {
          // 假设批量更新状态成功
          return { 
            success: true, 
            message: `成功${status ? '启用' : '停用'} ${ids.length} 名学生` 
          };
        },

        // 学生调动
        transferStudents(ids, targetOrgId) {
          // 假设批量调动成功
          return { 
            success: true, 
            message: `成功将 ${ids.length} 名学生调至新组织` 
          };
        }
      };

      // 组织架构模拟数据
      const departmentMock = {
        // 模拟组织树数据
        getOrganizationTree() {
          return [
            {
              key: 'school-1',
              title: '西北大学',
              nodeType: 'school',
              children: [
                {
                  key: 'college-1',
                  title: '计算机学院',
                  nodeType: 'college',
                  children: [
                    {
                      key: 'major-1',
                      title: '计算机科学与技术',
                      nodeType: 'major',
                      children: [
                        {
                          key: 'grade-1',
                          title: '2021级',
                          nodeType: 'grade',
                          children: [
                            {
                              key: 'class-1',
                              title: '计科2101班',
                              nodeType: 'class',
                              isLeaf: true
                            },
                            {
                              key: 'class-2',
                              title: '计科2102班',
                              nodeType: 'class',
                              isLeaf: true
                            }
                          ]
                        },
                        {
                          key: 'grade-2',
                          title: '2022级',
                          nodeType: 'grade',
                          children: [
                            {
                              key: 'class-3',
                              title: '计科2201班',
                              nodeType: 'class',
                              isLeaf: true
                            }
                          ]
                        }
                      ]
                    },
                    {
                      key: 'major-2',
                      title: '软件工程',
                      nodeType: 'major',
                      children: [
                        {
                          key: 'grade-3',
                          title: '2021级',
                          nodeType: 'grade',
                          children: [
                            {
                              key: 'class-4',
                              title: '软工2101班',
                              nodeType: 'class',
                              isLeaf: true
                            }
                          ]
                        }
                      ]
                    }
                  ]
                },
                {
                  key: 'college-2',
                  title: '信息学院',
                  nodeType: 'college',
                  children: [
                    {
                      key: 'major-3',
                      title: '通信工程',
                      nodeType: 'major',
                      children: []
                    }
                  ]
                }
              ]
            }
          ];
        }
      };

      // 配置Mock
      if (window.Mock) {
        // 学生管理API
        Mock.mock(/\/api\/students(\?.*)?$/, 'get', (options) => {
          const url = options.url;
          const params = {};
          if (url && url.includes('?')) {
            const queryString = url.split('?')[1];
            queryString.split('&').forEach(param => {
              const [key, value] = param.split('=');
              params[key] = decodeURIComponent(value);
            });
          }
          
          params.page = parseInt(params.page) || 1;
          params.pageSize = parseInt(params.pageSize) || 10;
          
          return {
            code: 200,
            data: studentMock.getStudentList(params),
            message: '获取学生列表成功'
          };
        });

        Mock.mock(/\/api\/students\/\w+$/, 'get', (options) => {
          const url = options.url || '';
          const id = url.split('/').pop();
          
          const student = studentMock.getStudentDetail(id);
          if (student) {
            return {
              code: 200,
              data: student,
              message: '获取学生详情成功'
            };
          } else {
            return {
              code: 404,
              data: null,
              message: '找不到该学生'
            };
          }
        });

        Mock.mock('/api/students', 'post', (options) => {
          const data = JSON.parse(options.body || '{}');
          
          return {
            code: 200,
            data: studentMock.createStudent(data),
            message: '创建学生成功'
          };
        });

        Mock.mock(/\/api\/students\/\w+$/, 'put', (options) => {
          const url = options.url || '';
          const id = url.split('/').pop();
          const data = JSON.parse(options.body || '{}');
          
          const updatedStudent = studentMock.updateStudent(id, data);
          if (updatedStudent) {
            return {
              code: 200,
              data: updatedStudent,
              message: '更新学生成功'
            };
          } else {
            return {
              code: 404,
              data: null,
              message: '找不到该学生'
            };
          }
        });

        Mock.mock(/\/api\/students\/\w+$/, 'delete', (options) => {
          const url = options.url || '';
          const id = url.split('/').pop();
          
          return {
            code: 200,
            data: studentMock.deleteStudent(id),
            message: '删除学生成功'
          };
        });

        Mock.mock('/api/students/batch-delete', 'post', (options) => {
          const data = JSON.parse(options.body || '{}');
          const ids = data.ids || [];
          
          return {
            code: 200,
            data: studentMock.batchDeleteStudents(ids),
            message: '批量删除成功'
          };
        });

        Mock.mock('/api/students/batch-update-status', 'post', (options) => {
          const data = JSON.parse(options.body || '{}');
          const ids = data.ids || [];
          const status = data.status !== undefined ? data.status : true;
          
          return {
            code: 200,
            data: studentMock.batchUpdateStudentStatus(ids, status),
            message: '批量更新状态成功'
          };
        });

        Mock.mock('/api/students/transfer', 'post', (options) => {
          const data = JSON.parse(options.body || '{}');
          const ids = data.ids || [];
          const targetOrgId = data.targetOrgId || '';
          
          return {
            code: 200,
            data: studentMock.transferStudents(ids, targetOrgId),
            message: '学生调动成功'
          };
        });

        // 组织架构API
        Mock.mock('/api/organization/tree', 'get', () => {
          return {
            code: 200,
            data: departmentMock.getOrganizationTree(),
            message: '获取组织架构树成功'
          };
        });
      }
    })();

    // Vue应用
    const { createApp, ref } = Vue;
    
    if (typeof antd === 'undefined') {
      // 如果Ant Design Vue未加载，显示错误
      document.getElementById('app').innerHTML = '<div style="color: red;">错误: Ant Design Vue未加载。请检查网络连接。</div>';
    } else {
      const app = createApp({
        setup() {
          const resultEl = ref(null);

          // 显示结果
          const showResult = (data) => {
            const result = document.getElementById('result');
            result.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
          };

          // 测试获取学生列表
          const testGetStudentList = async () => {
            try {
              showResult('正在获取学生列表...');
              
              const params = {
                organizationId: 'college-1',
                page: 1,
                pageSize: 10,
                keyword: ''
              };
              
              const response = await axios.get('/api/students', { params });
              showResult(response.data);
              
              if (response.data.code === 200) {
                showMessage('success', '获取学生列表成功');
              } else {
                showMessage('error', response.data.message || '获取学生列表失败');
              }
            } catch (error) {
              console.error('获取学生列表失败:', error);
              showResult(`获取学生列表失败: ${error.message}`);
              showMessage('error', `获取学生列表失败: ${error.message}`);
            }
          };

          // 测试获取学生详情
          const testGetStudentDetail = async () => {
            try {
              showResult('正在获取学生详情...');
              
              const response = await axios.get('/api/students/student-class-1-1');
              showResult(response.data);
              
              if (response.data.code === 200) {
                showMessage('success', '获取学生详情成功');
              } else {
                showMessage('error', response.data.message || '获取学生详情失败');
              }
            } catch (error) {
              console.error('获取学生详情失败:', error);
              showResult(`获取学生详情失败: ${error.message}`);
              showMessage('error', `获取学生详情失败: ${error.message}`);
            }
          };

          // 测试创建学生
          const testCreateStudent = async () => {
            try {
              showResult('正在创建学生...');
              
              const studentData = {
                name: '测试学生',
                studentId: '2101' + String(Math.floor(Math.random() * 10000)).padStart(4, '0'),
                gender: 'male',
                phone: '13800138000',
                email: 'test@example.com',
                organizationId: 'class-1',
                status: true
              };
              
              const response = await axios.post('/api/students', studentData);
              showResult(response.data);
              
              if (response.data.code === 200) {
                showMessage('success', '创建学生成功');
              } else {
                showMessage('error', response.data.message || '创建学生失败');
              }
            } catch (error) {
              console.error('创建学生失败:', error);
              showResult(`创建学生失败: ${error.message}`);
              showMessage('error', `创建学生失败: ${error.message}`);
            }
          };

          // 测试更新学生
          const testUpdateStudent = async () => {
            try {
              showResult('正在更新学生...');
              
              const studentData = {
                name: '更新后的学生',
                phone: '13900139000',
                email: 'updated@example.com'
              };
              
              const response = await axios.put('/api/students/student-class-1-1', studentData);
              showResult(response.data);
              
              if (response.data.code === 200) {
                showMessage('success', '更新学生成功');
              } else {
                showMessage('error', response.data.message || '更新学生失败');
              }
            } catch (error) {
              console.error('更新学生失败:', error);
              showResult(`更新学生失败: ${error.message}`);
              showMessage('error', `更新学生失败: ${error.message}`);
            }
          };

          // 测试删除学生
          const testDeleteStudent = async () => {
            try {
              showResult('正在删除学生...');
              
              const response = await axios.delete('/api/students/student-class-1-1');
              showResult(response.data);
              
              if (response.data.code === 200) {
                showMessage('success', '删除学生成功');
              } else {
                showMessage('error', response.data.message || '删除学生失败');
              }
            } catch (error) {
              console.error('删除学生失败:', error);
              showResult(`删除学生失败: ${error.message}`);
              showMessage('error', `删除学生失败: ${error.message}`);
            }
          };

          // 测试批量操作
          const testBatchOperations = async () => {
            try {
              showResult('正在测试批量操作...');
              
              // 批量删除
              const deleteResponse = await axios.post('/api/students/batch-delete', {
                ids: ['student-class-1-1', 'student-class-1-2', 'student-class-1-3']
              });
              
              // 批量更新状态
              const updateStatusResponse = await axios.post('/api/students/batch-update-status', {
                ids: ['student-class-2-1', 'student-class-2-2'],
                status: false
              });
              
              // 学生调动
              const transferResponse = await axios.post('/api/students/transfer', {
                ids: ['student-class-3-1', 'student-class-3-2'],
                targetOrgId: 'class-4'
              });
              
              showResult({
                batchDelete: deleteResponse.data,
                batchUpdateStatus: updateStatusResponse.data,
                transfer: transferResponse.data
              });
              
              showMessage('success', '批量操作测试完成');
            } catch (error) {
              console.error('批量操作测试失败:', error);
              showResult(`批量操作测试失败: ${error.message}`);
              showMessage('error', `批量操作测试失败: ${error.message}`);
            }
          };

          // 测试获取组织架构树
          const testOrganizationTree = async () => {
            try {
              showResult('正在获取组织架构树...');
              
              const response = await axios.get('/api/organization/tree');
              showResult(response.data);
              
              if (response.data.code === 200) {
                showMessage('success', '获取组织架构树成功');
              } else {
                showMessage('error', response.data.message || '获取组织架构树失败');
              }
            } catch (error) {
              console.error('获取组织架构树失败:', error);
              showResult(`获取组织架构树失败: ${error.message}`);
              showMessage('error', `获取组织架构树失败: ${error.message}`);
            }
          };

          return {
            testGetStudentList,
            testGetStudentDetail,
            testCreateStudent,
            testUpdateStudent,
            testDeleteStudent,
            testBatchOperations,
            testOrganizationTree
          };
        }
      });

      app.use(window.antd);
      app.mount('#app');
