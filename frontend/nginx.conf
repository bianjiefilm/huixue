server {
    listen 80;
    server_name localhost;

    # DNS resolver for Docker service discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 禁用不必要的日志，减少 I/O
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 静态资源代理到后端（修复PPTX/PDF等文件下载截断Bug）
    # 之前缺少此location块，导致 /static/* 请求被 fallback 到前端SPA，返回HTML替代二进制文件
    location /static {
        # 使用变量延迟DNS解析，避免启动时后端未就绪导致Nginx崩溃
        set $backend_static http://huixue-backend:8000;
        proxy_pass $backend_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 支持大文件传输（PPTX可达数MB）
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API代理到后端 - 使用Docker网络
    location /api {
        # 使用变量延迟DNS解析，避免启动时后端未就绪导致Nginx崩溃
        set $backend_api http://huixue-backend:8000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件大小限制
        client_max_body_size 50M;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
