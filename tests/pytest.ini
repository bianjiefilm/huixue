[pytest]
testpaths = tests/l0 tests/l1 tests/l2 tests/content
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    l0: L0 pure function / unit tests
    l1: L1 API contract tests
    l2: L2 UI interaction tests
    l3: L3 E2E tests
    slow: slow tests
    bi: BI visualization tests
    jupyter: Jupyter integration tests
    classroom: Classroom management tests
    ui: Playwright UI tests
    e2e: End-to-end tests
