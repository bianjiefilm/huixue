# =============================================================================
# 慧学 三服务器部署配置
# =============================================================================
#
# 部署架构：
#   节点一 (172.16.100.41): 数据存储 + 数据库 + 镜像仓库
#   节点二 (172.16.100.146): 核心计算 + 后端服务
#   节点三 (172.16.100.176): Web前端 + 管理服务
#
# 使用方法：
#   1. 修改下方 IP 地址和主机名配置
#     2. 在每台服务器上初始化 Docker Swarm
#   3. 运行 ./deploy.sh start
#
# =============================================================================

# 集群配置
CLUSTER_NAME=huixue
MANAGER_NODE=172.16.100.41
WORKER_NODES=172.16.100.146,172.16.100.176

# 节点一：数据存储与数据库中心
NODE1_HOSTNAME=bigdata-platform
NODE1_IP=172.16.100.41
NODE1_ROLE=storage,db,registry

# 节点二：核心计算节点
NODE2_HOSTNAME=dashujuyingyong
NODE2_IP=172.16.100.146
NODE2_ROLE=backend,worker

# 节点三：管理与服务节点
NODE3_HOSTNAME=huixuedashuju-PowerEdge-R730xd
NODE3_IP=172.16.100.176
NODE3_ROLE=frontend,manager

# 认证配置（请修改为实际密码）
SSH_USER=root
SSH_PASSWORD=12345678

# 镜像仓库配置
REGISTRY_NAME=registry
REGISTRY_PORT=5000
REGISTRY_URL=${NODE1_IP}:${REGISTRY_PORT}

# 服务配置
BACKEND_REPLICAS=2
FRONTEND_REPLICAS=1
JUPYTER_REPLICAS=1
