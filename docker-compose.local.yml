# =============================================================================
# 慧学 本地开发环境 Docker Compose 配置
# =============================================================================
#
# 使用方法：
#   docker-compose up -d
#   访问 http://localhost:3000
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 数据库
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: huixue-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: huixue
      POSTGRES_USER: huixue
      POSTGRES_PASSWORD: huixue123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huixue"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: huixue-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 后端 API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    image: huixue-backend:local
    container_name: huixue-backend-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ziyuan_data:/app/ziyuan_data:ro
      - student-work:/app/student_work
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://huixue:huixue123@db:5432/huixue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=local-dev-secret-key-change-in-production
      - RESOURCE_BASE_DIR=/app/ziyuan_data
      - HUIXUE_RESOURCE_DIR=/app/ziyuan_data
      - CONTAINER_STUDENT_WORK_BASE=/app/student_work
      - JUPYTER_BASE_URL=http://localhost:8888
      - JUPYTER_TOKEN=local_token
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 前端 (Vue + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    image: huixue-frontend:local
    container_name: huixue-frontend-local
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Jupyter 实训环境
  # ---------------------------------------------------------------------------
  jupyter:
    build: ./jupyter
    image: huixue-jupyter:local
    container_name: huixue-jupyter-local
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - jupyter-work:/home/jovyan/work
      - ./ziyuan_data:/home/jovyan/resources:ro
    environment:
      - JUPYTER_TOKEN=local_token
      - MPLCONFIGDIR=/home/jovyan/.config/matplotlib
    command: >
      start-notebook.sh
      --ServerApp.token=local_token
      --ServerApp.allow_origin='*'
      --ServerApp.disable_check_xsrf=True
      --ServerApp.tornado_settings="{'headers': {'Content-Security-Policy': \"frame-ancestors 'self' http://localhost:3000 http://localhost:3001 http://localhost:8000\"}}"

  # ---------------------------------------------------------------------------
  # VDI 云桌面
  # ---------------------------------------------------------------------------
  vdi:
    image: consol/ubuntu-xfce-vnc:latest
    container_name: huixue-vdi-local
    restart: unless-stopped
    ports:
      - "6080:6901"
      - "5901:5901"
    volumes:
      - vdi-work:/headless/Desktop
      - ./ziyuan_data:/headless/resources:ro
    environment:
      - VNC_PW=local123
      - VNC_RESOLUTION=1280x720
    shm_size: '512m'

# =============================================================================
# 网络
# =============================================================================
networks:
  default:
    name: huixue-local-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  postgres-data:
  redis-data:
  student-work:
  jupyter-work:
  vdi-work:
