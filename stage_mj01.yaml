description: |
  CRISP-DM 标准流程 (业务理解→数据理解→数据准备→建模→评估→部署)、
  监督/无监督/半监督学习的判别、accuracy 评估指标基础、过拟合诊断。

learning_objectives:
  - 能将一个活动描述映射到 CRISP-DM 的正确阶段
  - 能根据"是否有标签 / 是否全部标注"判断学习类型
  - 能从一对 y_true / y_pred 列表计算 accuracy
  - 能从训练/测试得分判断模型是否过拟合

