name: stage_wx02
course: 数据清洗
stage: 2
title: 缺失值检测与补全
order_in_practice: 2
difficulty: beginner

description: |
  缺失值的多种表达 (None / 空字符串 / NA / NaN / 自定义 marker)、
  数值列的均值/中位数/常量补全策略、删除策略; 含传感器数据补全业务案例。

learning_objectives:
  - 能给定单个值, 判断是否缺失 (多种 marker)
  - 能给定列表, 计数缺失值数量
  - 能给定数值列表, 用列表均值补全 (ignore missing)
  - 能给定列表与常量, 用常量补全所有 missing

