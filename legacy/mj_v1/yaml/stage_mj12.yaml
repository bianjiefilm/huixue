chapters:
  - title: "客户流失问题概述"
    content: |
      ## 12.1 业务背景

      客户流失(Churn)是电信、银行、电商等行业的核心指标:
      - 电信: 用户携号转网
      - 银行: 客户关闭账户
      - 电商: 用户超过N天未登录

      数据集字段(模拟电信流失数据):
      - customer_id: 客户ID
      - tenure: 在网时长(月)
      - contract_type: 合同类型(Month-to-month/1-year/2-year)
      - monthly_charges: 月费用
      - total_charges: 累计费用
      - internet_service: 网络服务类型
      - tech_support: 是否订阅技术支持
      - churn: 是否流失(目标变量)

  - title: "完整建模流程"
    content: |
      ## 12.2 全流程实现

      ```python
      import pandas as pd
      import numpy as np
      from sklearn.model_selection import train_test_split, GridSearchCV
      from sklearn.preprocessing import StandardScaler, LabelEncoder
      from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import classification_report, roc_auc_score, confusion_matrix

      # 1. 数据加载
      df = pd.read_csv('customer_churn.csv')

      # 2. EDA
      print(df.isnull().sum())
      print(df['churn'].value_counts(normalize=True))

      # 3. 预处理
      le = LabelEncoder()
      df['gender'] = le.fit_transform(df['gender'])
      # ... 其他编码

      X = df.drop('churn', axis=1)
      y = df['churn']

      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.2, stratify=y, random_state=42
      )

      # 4. 特征标准化
      scaler = StandardScaler()
      X_train_s = scaler.fit_transform(X_train)
      X_test_s = scaler.transform(X_test)

      # 5. 多模型比较
      models = {
          'LogisticRegression': LogisticRegression(max_iter=1000),
          'RandomForest': RandomForestClassifier(n_estimators=100),
          'GradientBoosting': GradientBoostingClassifier(n_estimators=100),
      }
      results = {}
      for name, model in models.items():
          model.fit(X_train_s, y_train)
          y_prob = model.predict_proba(X_test_s)[:, 1]
          results[name] = roc_auc_score(y_test, y_prob)
      best_model_name = max(results, key=results.get)
      print(f"Best: {best_model_name} AUC={results[best_model_name]:.4f}")
      ```

  - title: "模型优化与业务建议"
    content: |
      ## 12.3 GridSearch 调参

      ```python
      param_grid = {
          'n_estimators': [50, 100, 200],
          'max_depth': [3, 5, 7],
          'learning_rate': [0.05, 0.1, 0.2],
      }
      grid = GridSearchCV(
          GradientBoostingClassifier(random_state=42),
          param_grid, cv=5, scoring='roc_auc', n_jobs=-1
      )
      grid.fit(X_train_s, y_train)
      print(f"Best params: {grid.best_params_}")
      print(f"Best AUC: {grid.best_score_:.4f}")
      best_model = grid.best_estimator_
      ```

      ## 12.4 业务建议

      基于特征重要性给出可操作建议:

      ```python
      # 特征重要性
      importances = best_model.feature_importances_
      feature_imp = pd.DataFrame({'feature': X.columns, 'importance': importances})
      feature_imp = feature_imp.sort_values('importance', ascending=False)
      print(feature_imp.head())

      # 业务建议
      # - tenure 重要性高 → 关注新客户,建立早期关怀机制
      # - contract_type 重要 → 推广长期合约,减少月付用户流失风险
      # - tech_support 重要 → 加强技术支持服务推广
      ```
